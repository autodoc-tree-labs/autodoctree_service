spring:
  datasource:
    url: jdbc:h2:mem:autodoc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 51025

management:
  health:
    mail:
      enabled: false

auth:
  jwt-secret: test-secret-1234567890
  access-token-ttl-seconds: 900
  refresh-token-ttl-seconds: 1209600

storage:
  endpoint: http://localhost:9000
  access-key: minio
  secret-key: minio123
  bucket: autodoc
  region: us-east-1

search:
  backend: database

security:
  os-tenant-assert: true
  log-sanitizer-enabled: true
  log-max-string-length: 240

feature:
  embedding-ollama: false
  llm-labeling: false
  llm-explain: false
  tfidf-labeler-fallback: false
  label-quality-filter: true
  community-clustering: true
  nori-tokenizer: false
  feedback-routing-v2: true
  user-rules-v1: false
  admin-tree-debug: true

worker:
  poll-interval-ms: 86400000
  max-retries: 3
  debounce-window-seconds: 1

tree:
  neighbor-top-k: 3
  neighbor-min-similarity: 0.0
  neighbor-normalize: true
  max-cluster-size: 8
  min-cluster-size: 2
  community-resolution: 1.0
  personalization-decay: 0.85
  personalization-min-score: 0.8
  fusion-semantic-weight: 0.8
  fusion-lexical-weight: 0.2
  fusion-lexical-gate: 0.35
  other-cluster-score-threshold: 0.32

embedding:
  provider: stub
  input:
    max-chars: 2000
    head-chars: 1200
    tail-chars: 600
    section-heading-limit: 4
    section-count-limit: 16
  ollama:
    base-url: http://localhost:11434
    model: bge-m3
    timeout-ms: 5000
    batch-size: 16
    max-retries: 1
    retry-backoff-ms: 50
    circuit-failure-threshold: 2
    circuit-open-ms: 1000

llm:
  provider: ollama
  ollama:
    base-url: http://localhost:11434
    model: llama3.1:8b-instruct
    timeout-ms: 10000
    max-retries: 1
    retry-backoff-ms: 50
    circuit-failure-threshold: 2
    circuit-open-ms: 1000
