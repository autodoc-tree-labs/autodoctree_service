server:
  port: ${DOC_API_PORT:8080}

spring:
  application:
    name: doc-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autodoc}
    username: ${DB_USER:autodoc}
    password: ${DB_PASSWORD:autodoc}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

auth:
  jwt-secret: ${DOC_API_JWT_SECRET:dev-secret-change-me}
  access-token-ttl-seconds: ${DOC_API_ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-seconds: ${DOC_API_REFRESH_TOKEN_TTL_SECONDS:1209600}

storage:
  endpoint: ${S3_ENDPOINT:http://localhost:59000}
  access-key: ${S3_ACCESS_KEY:minio}
  secret-key: ${S3_SECRET_KEY:minio123}
  bucket: ${S3_BUCKET:autodoc}
  region: ${S3_REGION:us-east-1}

search:
  backend: ${SEARCH_BACKEND:opensearch}
  opensearch-url: ${OPENSEARCH_URL:http://localhost:59200}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index-alias: ${OPENSEARCH_INDEX_ALIAS:docs-active}
  template-name: ${OPENSEARCH_TEMPLATE_NAME:docs-template}

feature:
  auto-tree: true
  explain: true
  hybrid-search: false
  embedding-ollama: ${FEATURE_EMBEDDING_OLLAMA:false}
  llm-labeling: ${FEATURE_LLM_LABELING:true}
  llm-explain: ${FEATURE_LLM_EXPLAIN:true}
  tfidf-labeler-fallback: ${FEATURE_TFIDF_LABELER_FALLBACK:false}
  label-quality-filter: ${FEATURE_LABEL_QUALITY_FILTER:true}
  community-clustering: ${FEATURE_COMMUNITY_CLUSTERING:true}
  nori-tokenizer: ${FEATURE_NORI_TOKENIZER:true}
  feedback-routing-v2: ${FEATURE_FEEDBACK_ROUTING_V2:true}
  user-rules-v1: ${FEATURE_USER_RULES_V1:false}
  admin-tree-debug: ${FEATURE_ADMIN_TREE_DEBUG:true}

security:
  os-tenant-assert: true

worker:
  poll-interval-ms: 2000
  max-retries: 3
  debounce-window-seconds: 30

tree:
  neighbor-top-k: ${TREE_NEIGHBOR_TOP_K:5}
  neighbor-min-similarity: ${TREE_NEIGHBOR_MIN_SIMILARITY:0.25}
  neighbor-normalize: ${TREE_NEIGHBOR_NORMALIZE:true}
  max-cluster-size: ${TREE_MAX_CLUSTER_SIZE:20}
  min-cluster-size: ${TREE_MIN_CLUSTER_SIZE:2}
  community-resolution: ${TREE_COMMUNITY_RESOLUTION:1.0}
  personalization-decay: ${TREE_PERSONALIZATION_DECAY:0.85}
  personalization-min-score: ${TREE_PERSONALIZATION_MIN_SCORE:1.2}
  fusion-semantic-weight: ${TREE_FUSION_SEMANTIC_WEIGHT:0.8}
  fusion-lexical-weight: ${TREE_FUSION_LEXICAL_WEIGHT:0.2}
  fusion-lexical-gate: ${TREE_FUSION_LEXICAL_GATE:0.35}
  embedding-document-weight: ${TREE_EMBEDDING_DOCUMENT_WEIGHT:0.65}
  embedding-summary-weight: ${TREE_EMBEDDING_SUMMARY_WEIGHT:0.25}
  embedding-section-weight: ${TREE_EMBEDDING_SECTION_WEIGHT:0.10}
  other-cluster-score-threshold: ${TREE_OTHER_CLUSTER_SCORE_THRESHOLD:0.32}

embedding:
  provider: ${EMBEDDING_PROVIDER:stub}
  input:
    max-chars: ${EMBEDDING_INPUT_MAX_CHARS:4000}
    head-chars: ${EMBEDDING_INPUT_HEAD_CHARS:2400}
    tail-chars: ${EMBEDDING_INPUT_TAIL_CHARS:1200}
    section-heading-limit: ${EMBEDDING_INPUT_SECTION_HEADING_LIMIT:6}
    section-count-limit: ${EMBEDDING_INPUT_SECTION_COUNT_LIMIT:24}
  ollama:
    base-url: ${EMBEDDING_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${EMBEDDING_OLLAMA_MODEL:bge-m3}
    timeout-ms: ${EMBEDDING_OLLAMA_TIMEOUT_MS:5000}
    batch-size: ${EMBEDDING_OLLAMA_BATCH_SIZE:32}
    max-retries: ${EMBEDDING_OLLAMA_MAX_RETRIES:2}
    retry-backoff-ms: ${EMBEDDING_OLLAMA_RETRY_BACKOFF_MS:300}
    circuit-failure-threshold: ${EMBEDDING_OLLAMA_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-ms: ${EMBEDDING_OLLAMA_CIRCUIT_OPEN_MS:15000}

llm:
  provider: ${LLM_PROVIDER:ollama}
  ollama:
    base-url: ${LLM_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${LLM_OLLAMA_MODEL:llama3.1:8b-instruct}
    timeout-ms: ${LLM_OLLAMA_TIMEOUT_MS:10000}
    max-retries: ${LLM_OLLAMA_MAX_RETRIES:2}
    retry-backoff-ms: ${LLM_OLLAMA_RETRY_BACKOFF_MS:300}
    circuit-failure-threshold: ${LLM_OLLAMA_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-open-ms: ${LLM_OLLAMA_CIRCUIT_OPEN_MS:15000}
