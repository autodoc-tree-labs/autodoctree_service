server:
  port: ${DOC_API_PORT:8080}

spring:
  application:
    name: doc-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:autodoc}
    username: ${DB_USER:autodoc}
    password: ${DB_PASSWORD:autodoc}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

auth:
  jwt-secret: ${DOC_API_JWT_SECRET:dev-secret-change-me}
  access-token-ttl-seconds: ${DOC_API_ACCESS_TOKEN_TTL_SECONDS:900}
  refresh-token-ttl-seconds: ${DOC_API_REFRESH_TOKEN_TTL_SECONDS:1209600}

storage:
  endpoint: ${S3_ENDPOINT:http://localhost:9000}
  access-key: ${S3_ACCESS_KEY:minio}
  secret-key: ${S3_SECRET_KEY:minio123}
  bucket: ${S3_BUCKET:autodoc}
  region: ${S3_REGION:us-east-1}

search:
  backend: ${SEARCH_BACKEND:opensearch}
  opensearch-url: ${OPENSEARCH_URL:http://localhost:9200}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  index-alias: ${OPENSEARCH_INDEX_ALIAS:docs-active}
  template-name: ${OPENSEARCH_TEMPLATE_NAME:docs-template}

feature:
  auto-tree: true
  explain: true
  hybrid-search: false

security:
  os-tenant-assert: true

worker:
  poll-interval-ms: 2000
  max-retries: 3
  debounce-window-seconds: 30
