name: autodoctree-monorepo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: autodoc
      POSTGRES_USER: autodoc
      POSTGRES_PASSWORD: autodoc
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autodoc -d autodoc"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: "Admin123!Admin123!"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-59200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 20s
      timeout: 10s
      retries: 15
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT:-59000}:9000"
      - "${MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 10s
      retries: 15
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 minio minio123;
      mc mb --ignore-existing local/autodoc;
      exit 0;'

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_SMTP_PORT:-51025}:1025"
      - "${MAILPIT_UI_PORT:-58025}:8025"

  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["llm"]
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:0.5.7
    profiles: ["llm-init"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c '
      set -e;
      for model in bge-m3 llama3.1:8b-instruct; do
        echo "[ollama-init] pulling $$model";
        retries=0;
        until ollama pull "$$model"; do
          retries=$$((retries+1));
          if [ "$$retries" -ge 5 ]; then
            echo "[ollama-init] failed to pull $$model after $$retries attempts" >&2;
            exit 1;
          fi;
          sleep 3;
        done;
      done;
      ollama list;
      exit 0;'
    volumes:
      - ollama-data:/root/.ollama

  reranker-api:
    build:
      context: ./services/reranker-api
      dockerfile: Dockerfile
    profiles: ["ml"]
    depends_on:
      model-preflight:
        condition: service_completed_successfully
    ports:
      - "${RERANKER_PORT:-18080}:18080"
    environment:
      RERANKER_BACKEND: ${RERANKER_BACKEND:-lexical}
      RERANKER_MODEL_PATH: /models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:18080/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - ./models:/models:ro

  model-preflight:
    image: python:3.12-alpine
    profiles: ["ml"]
    working_dir: /workspace
    entrypoint: >
      /bin/sh -c '
      set -e;
      python3 scripts/model_manifest_verify.py --manifest models/manifest.json --workspace /workspace;'
    volumes:
      - ./:/workspace:ro

  structure-worker:
    build:
      context: ./services/structure-worker
      dockerfile: Dockerfile
    profiles: ["structure"]
    ports:
      - "${STRUCTURE_WORKER_PORT:-18081}:18081"
    environment:
      STRUCTURE_WORKER_MODE: ${STRUCTURE_WORKER_MODE:-heuristic}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:18081/health', timeout=2)\""]
      interval: 15s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-59090}:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/tree_rules.yml:/etc/prometheus/tree_rules.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.3
    profiles: ["observability"]
    ports:
      - "${GRAFANA_PORT:-53000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    depends_on:
      - prometheus
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards/tree:/var/lib/grafana/dashboards/tree:ro

volumes:
  postgres-data:
  opensearch-data:
  minio-data:
  ollama-data:
  grafana-data:
